[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-india-eod"
version = "1.1.0"
description = "Work with the free WealthTechnical NSE/BSE EOD Downloader's local data in Python - watchlists, indices, market breadth, sector rotation, quality checks and exports for NT8, AmiBroker, MetaStock, MetaTrader 5, CSV and SQLite."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "WealthTechnical LLP" }]
requires-python = ">=3.8"
dependencies = ["pandas>=1.5"]
keywords = ["nse", "bse", "nifty", "india", "eod", "market breadth", "pandas", "amibroker", "ninjatrader"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Office/Business :: Financial :: Investment", "Intended Audience :: Developers", "Intended Audience :: Financial and Insurance Industry"]

[project.optional-dependencies]
parquet = ["pyarrow"]
charts = ["matplotlib"]

[project.urls]
Homepage = "https://www.wealthtechnical.com/free-data-kits/"
Source = "https://github.com/wealthtechnical-afk/nse-bse-eod-downloader/tree/main/india-data-kit"

[project.scripts]
wt-india-eod = "wt_india_eod:main"

[tool.setuptools]
package-dir = { "" = "python" }
py-modules = ["wt_india_eod"]
